services:
  postgres-db:
    image: postgres:15-alpine
    container_name: habbah_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: habbah_db
    ports:
      - "5499:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habbah_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres-db:5432/habbah_db
      PAYLOAD_SECRET: habbah_payload_secret_2026_super_secure_xK9mP2nR
      JWT_SECRET: habbah_jwt_secret_super_secure_2026_xK9mP2nR
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production
      DB_SEED: "true"
      CMS_SEED: "true"
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always
    volumes:
      - ./public:/app/public

volumes:
  postgres_data: